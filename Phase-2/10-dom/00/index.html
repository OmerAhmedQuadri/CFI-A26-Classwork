<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #display-btn{
            padding: 10px;
            margin: 20px;
        }
    </style>
</head>

<body>
    <input type="text" name="" id="input-msg">
    <button id="display-btn">Display</button>
</body>
<script>
    const inputBox = document.getElementById('input-msg')
    const displayBtn = document.getElementById('display-btn')
    // inputBox.value = 'default message'

    displayBtn.addEventListener('click', () => {
        const msg = inputBox.value
        inputBox.value = ''
        console.log(msg);
        window.alert(msg)
    })
</script>

</html>
