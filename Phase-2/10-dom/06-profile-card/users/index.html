<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.8.0/axios.min.js"
        integrity="sha512-Rjx/Bee5UEvuxMc3Au6ShLf08nh+v4q3sNCI/+pSzypORWeVZG5jRZBKxM6RlA7L4hbHykwFXhmlBu/cJBaDRg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
    <div id="profile-card">
        <div id="avatar">
            <img id="avatar-img" src="#" alt="User Avatar">
        </div>
        <div id="info">
            <h3 id="fullname">John Doe</h3>
            <h4>@<span id="username">john_doe</span></h4>
            <p id="bio">your bio</p>
            <ul>
                <li id="email-li">
                    <img src="https://img.icons8.com/?size=100&id=60688&format=png&color=000000" alt="">
                    <p id="email">someemail@example.com</p>
                </li>
                <li>
                    <img src="https://img.icons8.com/?size=100&id=120710&format=png&color=000000" alt="">
                    <p id="repo-count">0 repositories</p>
                </li>
                <li>
                    <img src="https://img.icons8.com/?size=100&id=3723&format=png&color=000000" alt="">
                    <p id="location">Location</p>
                </li>
                <li>
                    <img src="https://img.icons8.com/?size=100&id=59826&format=png&color=000000" alt="">
                    <a id="website" href="#" target="_blank">https://example.com</a>
                </li>
            </ul>
            <button id="profile-btn">View Profile</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
