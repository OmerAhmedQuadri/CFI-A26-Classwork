<html>

<head>
    <title>Buttons</title>
    <link rel="stylesheet" href="06.css">
    <style>
        #subscribe-btn {
            background-color: red;
            border: 0px;
            color: #ffffff;
            border-radius: 3px;
            padding-top: 10px ;
            padding-bottom: 10px ;
            padding-inline: 12px;
            margin: 10px 40px;
            /* px-20 */
        }
        #subscribe-btn:hover {
            background-color: rgb(141, 0, 0);
            color: #b9b9b9;
        }
    </style>
</head>

<body>
    <div>
        <a href="http://youtube.com"><button id="subscribe-btn" >Subscribe</button></a>
        
    </div>
    <a href="http://google.com"><button class="google-btn">Google Search</button></a>
    <button onclick="alert('button clicked');console.log('button was clicked')">somebutton</button>
</body>

</html>
