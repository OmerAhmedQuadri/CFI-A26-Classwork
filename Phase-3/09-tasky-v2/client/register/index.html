<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasky</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.8.0/axios.min.js"
        integrity="sha512-Rjx/Bee5UEvuxMc3Au6ShLf08nh+v4q3sNCI/+pSzypORWeVZG5jRZBKxM6RlA7L4hbHykwFXhmlBu/cJBaDRg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body class="flex flex-col items-center justify-center min-h-screen bg-white">
    <div id="container" class=" min-w-[400px] p-8 px-12 border border-gray-700 rounded-lg shadow-lg shadow-gray-300 bg-white">
        <h1 class="text-2xl font-bold mb-6">Tasky</h1>
        <form id="registerForm" class="flex flex-col gap-4 mt-4">
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" class="p-2 border border-black rounded">

            <input type="email" id="email" name="email" placeholder="Email" class="p-2 border border-black rounded">
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" class="p-2 border border-black rounded">

            <input type="password" id="password" name="password" placeholder="Password"
                class="p-2 border border-black rounded">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
                class="p-2 border border-black rounded">


            <button type="submit"
                class="p-2 bg-black text-white rounded border border-black hover:bg-white hover:text-black transition duration-200">Sign up</button>
                
        </form>
        <p class="text-xs mt-1 text-center">Already have an account? <a href="/login"
                class="text-blue-500 hover:underline">Login</a></p>
        <div id="errorContainer" class="mt-4 border border-red-400 rounded p-1 bg-red-300 hidden">
            <p id="error-message" class="text-red-500 text-sm text-center">Something went wrong.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
